<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivos Digitales | Iniciar sesión</title>

    <!-- Bootstrap 5 (estilos) e íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Mis estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">

    <main class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card shadow tarjeta-login">
                    <div class="card-body p-4 p-md-5">

                        <!-- Título y nombre del alumno -->
                        <div class="text-center mb-4">
                            <i class="bi bi-folder2-open icono-login"></i>
                            <h1 class="h3 fw-bold mt-2 mb-1">Archivos Digitales</h1>
                            <p class="text-body-secondary mb-0">Jaime Jared González García</p>
                        </div>

                        <!-- Aquí aparecen los avisos de error o éxito -->
                        <div id="mensaje"></div>

                        <!-- Pestañas: iniciar sesión / crear cuenta -->
                        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#form-login"
                                        type="button" role="tab">Iniciar sesión</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#form-registro"
                                        type="button" role="tab">Crear cuenta</button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <!-- Formulario de inicio de sesión -->
                            <form id="form-login" class="tab-pane fade show active" role="tabpanel">
                                <div class="mb-3">
                                    <label for="login-correo" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="login-correo"
                                           placeholder="correo@ejemplo.com" required autocomplete="email">
                                </div>
                                <div class="mb-4">
                                    <label for="login-password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="login-password"
                                           required autocomplete="current-password">
                                </div>
                                <button type="submit" class="btn btn-primary w-100" id="btn-login">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                                </button>
                            </form>

                            <!-- Formulario para crear cuenta -->
                            <form id="form-registro" class="tab-pane fade" role="tabpanel">
                                <div class="mb-3">
                                    <label for="registro-correo" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="registro-correo"
                                           placeholder="correo@ejemplo.com" required autocomplete="email">
                                </div>
                                <div class="mb-4">
                                    <label for="registro-password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="registro-password"
                                           minlength="6" required autocomplete="new-password">
                                    <div class="form-text">Mínimo 6 caracteres.</div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" id="btn-registro">
                                    <i class="bi bi-person-plus me-1"></i>Crear cuenta
                                </button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Librerías: Bootstrap (JS) y Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Mis archivos JS (el orden importa) -->
    <script src="js/supabase.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
